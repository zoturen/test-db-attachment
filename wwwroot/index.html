<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow">Simple &amp; fast</p>
        <h1>Todos</h1>
      </div>
      <p class="stats" id="stats">0 items</p>
    </header>

    <form class="add-form" id="add-form">
      <input
        id="title-input"
        type="text"
        placeholder="What needs to be done?"
        maxlength="200"
        autocomplete="off"
        required
      >
      <button type="submit">Add</button>
    </form>

    <ul class="todo-list" id="todo-list"></ul>
    <p class="empty" id="empty-state">Nothing here yet. Add your first todo.</p>
  </main>

  <template id="todo-template">
    <li class="todo-item">
      <label class="todo-check">
        <input type="checkbox">
        <span class="checkmark"></span>
      </label>
      <span class="todo-title"></span>
      <button type="button" class="delete-btn" aria-label="Delete todo">&times;</button>
    </li>
  </template>

  <script src="/app.js"></script>
</body>
</html>
